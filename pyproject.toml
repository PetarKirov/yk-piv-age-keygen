[project]
name = "yk-piv-age-keygen"
version = "0.1.1"
description = "YubiKey PIV key generator compatible with age-plugin-yubikey"
readme = "README.md"
authors = [
    { name = "Philip Eklöf", email = "phi@pxy.se" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "yubikey-manager>=5.9.2,<5.10",  # private ykman APIs are used
]

[project.scripts]
yk-piv-age-keygen = "yk_piv_age_keygen:cli.main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
